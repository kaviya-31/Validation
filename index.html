<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cyber Contact Portal</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="bg-glow glow1"></div>
<div class="bg-glow glow2"></div>

<div class="container">

<h1>CYBER CONTACT PORTAL</h1>

<p class="subtitle">
Secure Communication Interface
</p>

<form id="contactForm">

<div class="input-box">

<label>Name</label>

<input
type="text"
id="name"
placeholder="Enter your name">

</div>

<div class="input-box">

<label>Email</label>

<input
type="text"
id="email"
placeholder="Enter your email">

</div>

<div class="input-box">

<label>Phone</label>

<input
type="text"
id="phone"
placeholder="Enter your phone">

</div>

<div class="input-box">

<label>Message</label>

<textarea
id="message"
rows="5"
placeholder="Type your message">
</textarea>

</div>

<button type="submit">
Transmit Data
</button>

<p id="result"></p>

</form>

</div>

<script src="script.js"></script>

</body>
</html>
